# Builds the package and publishes it to npm when a version tag (v1.2.3) is pushed.
# For more information see: https://docs.github.com/en/actions/publishing-packages/publishing-nodejs-packages

name: Publish Package to NPM

on:
  push:
    tags: v*

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          registry-url: "https://registry.npmjs.org"
      - name: Check the tag matches the package version
        run: |
          version=$(node -p "require('./assets/package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match assets/package.json version $version"
            exit 1
          fi
      - run: npm ci
      - run: npm run build
      - run: npm publish --access public --ignore-scripts
        working-directory: dist
